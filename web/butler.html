<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jarvis · Butler</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app" class="layout">
      <aside class="sidebar">
        <div class="sidebar-head">
          <h1>Jarvis</h1>
        </div>
        <nav>
          <a href="/" class="nav-item">Chat</a>
          <a href="/memory.html" class="nav-item">Memoria</a>
          <a href="/butler.html" class="nav-item active">Butler <span class="badge" id="butler-badge"></span></a>
          <a href="/lab.html" class="nav-item">Lab</a>
          <button id="settings-btn" type="button" class="nav-item ghost">Ajustes</button>
        </nav>
      </aside>
      <main class="main butler-main">
        <header class="butler-head">
          <h2>Butler</h2>
          <p class="hint">Jarvis detecta acciones implícitas tras cada conversación. Acepta lo que tenga sentido, descarta lo que no.</p>
        </header>
        <section>
          <h3>Pendientes</h3>
          <ul id="pending" class="suggestions"></ul>
        </section>
        <details>
          <summary>Historial</summary>
          <h3>Aceptadas</h3>
          <ul id="accepted" class="suggestions"></ul>
          <h3>Descartadas</h3>
          <ul id="dismissed" class="suggestions"></ul>
        </details>
      </main>
    </div>
    <dialog id="settings-dialog">
      <form method="dialog" id="settings-form">
        <h2>Ajustes</h2>
        <label>
          API URL
          <input type="url" id="api-url" placeholder="https://jarvis.tu-cuenta.workers.dev" required />
        </label>
        <label>
          Bearer token
          <input type="password" id="api-key" required />
        </label>
        <menu>
          <button value="cancel">Cancelar</button>
          <button id="settings-save" value="save">Guardar</button>
        </menu>
      </form>
    </dialog>
    <script type="module" src="/src/butler.ts"></script>
  </body>
</html>
