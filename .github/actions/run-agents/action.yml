name: run-agents
description: Restaura el estado, ejecuta los 8 agentes durante N minutos, guarda el estado y encadena la siguiente ejecución.
inputs:
  minutes:
    description: Minutos de ejecución antes de la parada ordenada
    required: true
  searxng:
    description: Levantar un SearXNG local con Docker para búsquedas web sin bloqueos
    required: false
    default: "false"
  token:
    description: GITHUB_TOKEN (contents:write, actions:write)
    required: true
runs:
  using: composite
  steps:
    - name: Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
    - name: Dependencias
      shell: bash
      run: python -m pip install -q -r requirements.txt
    - name: SearXNG local
      if: inputs.searxng == 'true'
      shell: bash
      run: |
        docker run -d --name searxng -p 8888:8080 -v "$PWD/searxng:/etc/searxng" searxng/searxng:2026.9.25-12f8b6515
        for i in $(seq 1 30); do curl -sf "http://127.0.0.1:8888/search?q=test&format=json" >/dev/null && break; sleep 2; done
        echo "SEARXNG_URL=http://127.0.0.1:8888" >> "$GITHUB_ENV"
    - name: Restaurar estado (rama agents-data)
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: scripts/gh_state.sh pull
    - name: Comprobar modelo
      shell: bash
      run: |
        if curl -sf -m 15 -H "Authorization: Bearer ${LLM_API_KEY:-none}" "$LLM_BASE_URL/models" >/dev/null; then
          echo "modelo accesible en $LLM_BASE_URL"
        else
          echo "::error::el modelo no responde en $LLM_BASE_URL (secreto LLM_BASE_URL / túnel / llama-server)"; exit 3
        fi
    - name: Agentes
      id: agents
      shell: bash
      env:
        MINUTES: ${{ inputs.minutes }}
      run: |
        set +e
        python -m stevecan --minutes "$MINUTES" --wait-minutes 10
        code=$?
        echo "code=$code" >> "$GITHUB_OUTPUT"
        exit $code
    - name: Guardar estado (rama agents-data)
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: scripts/gh_state.sh push
    - name: Encadenar siguiente ejecución
      if: always() && steps.agents.outputs.code == '0'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        MINUTES: ${{ inputs.minutes }}
      run: |
        curl -sf -X POST \
          -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/agents.yml/dispatches" \
          -d "{\"ref\":\"$GITHUB_REF_NAME\",\"inputs\":{\"minutes\":\"$MINUTES\"}}"
        echo "siguiente ejecución encadenada en $GITHUB_REF_NAME"
