name = "jarvis"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

[vars]
JARVIS_SYSTEM_PROMPT = "You are Jarvis, a concise and capable personal AI assistant."
JARVIS_MODEL = "gpt-4o-mini"
JARVIS_VERSION = "0.3.0"
# Comma-separated list of allowed origins for the web HUD. Use "*" for any (dev only).
JARVIS_WEB_ORIGIN = "*"
# Butler runs after each chat response to detect actionable suggestions.
JARVIS_BUTLER_ENABLED = "true"
JARVIS_BUTLER_MODEL = "gpt-4o-mini"

[[durable_objects.bindings]]
name = "HUD_HUB"
class_name = "HudHub"

[[migrations]]
tag = "v1"
new_classes = ["HudHub"]

# Replace `database_id` after running: wrangler d1 create jarvis
[[d1_databases]]
binding = "DB"
database_name = "jarvis"
database_id = "REPLACE_WITH_REAL_D1_ID"
migrations_dir = "migrations"

# Secrets — set via `wrangler secret put`:
#   OPENAI_API_KEY
#   JARVIS_API_KEY
