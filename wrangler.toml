name = "jarvis"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

[vars]
JARVIS_SYSTEM_PROMPT = "You are Jarvis, a concise and capable personal AI assistant."
JARVIS_MODEL = "gpt-4o-mini"
JARVIS_VERSION = "0.1.0"

# Replace `database_id` after running: wrangler d1 create jarvis
[[d1_databases]]
binding = "DB"
database_name = "jarvis"
database_id = "REPLACE_WITH_REAL_D1_ID"
migrations_dir = "migrations"

# Secrets — set via `wrangler secret put`:
#   OPENAI_API_KEY
#   JARVIS_API_KEY
